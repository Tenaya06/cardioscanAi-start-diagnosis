<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CardioScanAI</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body
    style="background-image: url('/auth-bg.png'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center;">
    <div class="auth-container">
        <div class="auth-card fade-in">
            <a href="/" class="logo" style="margin-bottom: 2rem; display: block;">CardioScanAI</a>
            <h2>Welcome Back</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2.5rem;">Please enter your details to sign in.</p>

            <button class="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20">
                Continue with Google
            </button>

            <div class="divider">OR</div>

            <form action="/diagnosis.html">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; justify-content: center; margin-top: 1rem;">Sign In</button>
            </form>

            <p style="margin-top: 2rem; color: var(--text-secondary); font-size: 0.9rem;">
                Don't have an account? <a href="/signup.html"
                    style="color: var(--primary); text-decoration: none; font-weight: 600;">Create Account</a>
            </p>
        </div>
    </div>
</body>

</html>
